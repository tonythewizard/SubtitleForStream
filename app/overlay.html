<!doctype html><html lang="it"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>SubtitleForStream Overlay</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:transparent;overflow:hidden}#wrap{position:absolute;left:5%;right:5%;bottom:100px;display:flex;flex-direction:column;align-items:center;gap:12px;pointer-events:none} .caption{max-width:95%;text-align:center;border-radius:12px;padding:10px 24px;overflow-wrap:break-word;word-break:normal;box-shadow:0 6px 22px #0005;} .tag{font-weight:800;font-size:.44em;letter-spacing:1px;margin-bottom:4px}.words{font-weight:800;line-height:1.18;white-space:normal}.caption.alert .words{color:#FFE55A!important}.caption.excited .words{color:#80EDB2!important}.caption.sad .words{color:#C4B5FD!important} .animate{animation:pop .22s ease-out}@keyframes pop{from{transform:scale(.93);opacity:0}to{transform:scale(1);opacity:1}} .minimal{background:transparent!important;box-shadow:none!important} .neon{outline:2px solid #A78BFA;box-shadow:0 0 24px #A78BFA50}.classic{border-radius:0}.gaming{border-radius:12px}
</style></head><body><div id="wrap"></div><script>
const wrap=document.getElementById('wrap');let last='';
function validColor(s, fallback){return /^#[0-9a-fA-F]{6}$/.test(s||'')?s:fallback}
function render(data){
 const st=data.style||{};wrap.style.bottom=Math.max(0,Math.min(700,Number(st.bottom)||100))+'px';
 const captions=(data.captions||[]).slice(-(Math.max(1,Math.min(4,Number(st.max_lines)||2))));
 const key=JSON.stringify({captions:captions.map(c=>[c.id,c.text,c.mood,c.label,c.color]),style:st});if(key===last)return;last=key;
 wrap.replaceChildren();
 captions.forEach(c=>{
 const div=document.createElement('div');const preset=String(st.preset||'Gaming').toLowerCase();div.className='caption '+ (['gaming','minimal','neon','classic'].includes(preset)?preset:'gaming')+' '+(c.mood||'normal')+(st.animate?' animate':'');
 const bg=validColor(st.background,'#111827');const alpha=Math.max(0,Math.min(100,Number(st.bg_opacity??82)))/100;
 div.style.background=`rgba(${parseInt(bg.slice(1,3),16)},${parseInt(bg.slice(3,5),16)},${parseInt(bg.slice(5,7),16)},${alpha})`;
 if(alpha===0)div.style.boxShadow='none';
 const font=String(st.font||'Segoe UI').replace(/[<>]/g,'').slice(0,70);
 div.style.fontFamily=JSON.stringify(font)+',sans-serif';div.style.fontSize=Math.max(18,Math.min(120,Number(st.font_size)||48))+'px';
 const tag=document.createElement('div');tag.className='tag';tag.style.color=validColor(c.color,'#67E8F9');tag.textContent=c.label||'AUDIO';
 const words=document.createElement('div');words.className='words';words.style.color=validColor(st.text_color,'#FFFFFF');words.textContent=c.text||'';
 const outline=Math.max(0,Math.min(6,Number(st.outline)||0));words.style.webkitTextStroke=outline+'px #10141B';words.style.paintOrder='stroke fill';
 div.append(tag,words);wrap.append(div);
 })
}
async function tick(){try{const r=await fetch('/state',{cache:'no-store'});if(r.ok)render(await r.json())}catch(e){}finally{setTimeout(tick,50)}}
tick();</script></body></html>
